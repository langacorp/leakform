name: self-test

# Runs the tool's own two-direction self-test on every push.
# The point is not that it passed once: it is that it passes today.
#
# NO SECRETS. This workflow reads nothing but the repository itself and needs
# no credentials — the permissions below say so explicitly rather than relying
# on the default.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  selftest:
    # Python 3.8, the declared floor, runs in the "floor" job below.
    # ubuntu-latest (26.04) no longer ships 3.9, so 3.9 runs on
    # ubuntu-24.04. The newest runner covers the other end.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.15" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # A file that does not compile is a test that never ran, and from the
      # outside it looks exactly like one that passed.
      - name: Compile
        run: python -m compileall -q leakform.py tests

      # Both directions: it must fire on a planted case and stay silent on a
      # clean one. A check that only ever passes proves nothing.
      - name: Self-test
        run: python leakform.py --selftest

      # Every category, every exit code, every git failure, and the hook in
      # temporary repositories. Each test was seen failing before its fix.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  floor:
    # The floor without the ubuntu-22.04 runner, which GitHub retires in
    # April 2027: the same Ubuntu 22.04 userland as a container, with its
    # git (2.34, older than the 2.36 that some options need) and Python 3.8.
    # git is installed before checkout so the tests run in a real clone.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install git
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Versions
        run: python --version && git --version

      - name: Compile
        run: python -m compileall -q leakform.py tests

      - name: Self-test
        run: python leakform.py --selftest

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  hook:
    # The hook runs under whatever awk the machine has. mawk is the default
    # on Debian and Ubuntu, gawk elsewhere; the hook was once right for one
    # and silent on the other, so both are run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install the awks
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends mawk gawk

      - name: Hook under mawk and gawk
        env:
          LEAKFORM_TEST_AWKS: /usr/bin/mawk:/usr/bin/gawk
        run: python -m unittest discover -s tests -p test_hook.py -v
